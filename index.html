<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="src/components/input/input.css" />
    <link rel="stylesheet" href="src/components/progress/progress.css" />
    <link
      rel="stylesheet"
      href="src/components/switch-input/switch-input.css"
    />
    <title>OZON</title>
  </head>
  <body>
    <header class="header">
      <h1>Progress</h1>
    </header>
    <main class="progress-layout">
      <div
        aria-label="progress"
        class="progress-container"
        id="progress-container"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
      ></div>

      <div class="progress-controls">
        <div class="input-item">
          <div id="input-value-container"></div>
          <label class="input-item-label" for="input-value">Value</label>
        </div>
        <div class="input-item">
          <div id="input-animate-container"></div>
          <label class="input-item-label" for="input-animate">Animate</label>
        </div>
        <div class="input-item">
          <div id="input-hide-container"></div>
          <label class="input-item-label" for="input-hide">Hide</label>
        </div>
      </div>
    </main>
  </body>
  <script type="module" src="script.js"></script>
</html>
